# Copy this file to secrets.yaml and fill in your own values.
# secrets.yaml is git-ignored, so it never ends up in the repository.

wifi_ssid: "your-wifi-name"
wifi_password: "your-wifi-password"

# Encryption key for the Home Assistant API and for OTA updates
# (32 random bytes, base64). Generate one with:  openssl rand -base64 32
api_key: "paste-the-generated-key-here"

# Password for the fallback hotspot "air-sensor Fallback" (shown when WiFi fails).
# At least 8 characters.
ap_password: "choose-a-hotspot-password"
